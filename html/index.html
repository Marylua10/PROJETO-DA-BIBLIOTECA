<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | ToschiBook</title>

    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <main class="login-page">

        <section class="brand-panel">
            <div class="brand-content">

                <div class="logo">
                    <div class="logo-icon">
                        <!-- Ícone provisório do ToschiBook -->
                        <svg viewBox="0 0 64 64" aria-hidden="true">
                            <path d="M10 12h29c8 0 15 7 15 15v27H25c-8 0-15-6-15-14V12Z"
                                  fill="none"
                                  stroke="currentColor"
                                  stroke-width="4"
                                  stroke-linejoin="round"/>

                            <path d="M25 54V27c0-8 6-15 14-15"
                                  fill="none"
                                  stroke="currentColor"
                                  stroke-width="4"
                                  stroke-linecap="round"/>

                            <path d="M39 12c0 8 6 15 15 15"
                                  fill="none"
                                  stroke="currentColor"
                                  stroke-width="4"
                                  stroke-linecap="round"/>

                            <path d="M18 21h11M18 29h8"
                                  fill="none"
                                  stroke="currentColor"
                                  stroke-width="3"
                                  stroke-linecap="round"/>
                        </svg>
                    </div>

                    <span>Toschi<span>Book</span></span>
                </div>

                <div class="welcome-text">
                    <h1>Bem-vindo ao ToschiBook</h1>

                    <p>
                        Organize, consulte e gerencie o acervo da sua biblioteca
                        de forma simples, rápida e eficiente.
                    </p>
                </div>

                <div class="books-decoration">
                    <span class="book book-one"></span>
                    <span class="book book-two"></span>
                    <span class="book book-three"></span>
                    <span class="book book-four"></span>
                </div>

            </div>
        </section>

        <section class="form-panel">
            <div class="login-card">

                <div class="mobile-logo logo">
                    <div class="logo-icon">
                        <svg viewBox="0 0 64 64" aria-hidden="true">
                            <path d="M10 12h29c8 0 15 7 15 15v27H25c-8 0-15-6-15-14V12Z"
                                  fill="none"
                                  stroke="currentColor"
                                  stroke-width="4"
                                  stroke-linejoin="round"/>

                            <path d="M25 54V27c0-8 6-15 14-15"
                                  fill="none"
                                  stroke="currentColor"
                                  stroke-width="4"
                                  stroke-linecap="round"/>

                            <path d="M39 12c0 8 6 15 15 15"
                                  fill="none"
                                  stroke="currentColor"
                                  stroke-width="4"
                                  stroke-linecap="round"/>
                        </svg>
                    </div>

                    <span>Toschi<span>Book</span></span>
                </div>

                <div class="form-header">
                    <h2>Acesse sua conta</h2>
                    <p>Entre com seus dados para continuar</p>
                </div>

                <form id="loginForm" novalidate>

                    <div class="input-group">
                        <label for="email">E-mail ou usuário</label>

                        <div class="input-wrapper">
                            <span class="input-icon">✉</span>

                            <input
                                type="text"
                                id="email"
                                name="email"
                                placeholder="Digite seu e-mail ou usuário"
                                autocomplete="username"
                            >
                        </div>

                        <small class="error-message" id="emailError"></small>
                    </div>

                    <div class="input-group">
                        <label for="password">Senha</label>

                        <div class="input-wrapper">
                            <span class="input-icon">●</span>

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Digite sua senha"
                                autocomplete="current-password"
                            >

                            <button
                                type="button"
                                class="show-password"
                                id="togglePassword"
                                aria-label="Mostrar senha"
                            >
                                Mostrar
                            </button>
                        </div>

                        <small class="error-message" id="passwordError"></small>
                    </div>

                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" id="remember">
                            <span class="checkmark"></span>
                            Lembrar-me
                        </label>

                        <a href="#" id="forgotPassword">
                            Esqueci minha senha
                        </a>
                    </div>

                    <button type="submit" class="login-button" id="loginButton">
                        <span class="button-text">Entrar</span>
                        <span class="loading-spinner"></span>
                    </button>

                    <p class="status-message" id="statusMessage"></p>

                </form>

                <div class="form-footer">
                    <p>
                        Ainda não tem conta?
                        <a href="cadastro.html" class="create-account-link">
                            Criar conta
                        </a>
                    </p>
                    <p>
                        ToschiBook &copy; <span id="currentYear"></span>
                    </p>
                </div>

            </div>
        </section>

    </main>

    <script src="../javascript/script.js"></script>
</body>
</html>
